<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Percentage Checker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h2>Attendance Percentage Checker</h2>
      <div class="form">
        <label for="total_days">Total days college runs:</label>
        <input type="number" id="total_days" placeholder="Enter total days" />
        <label for="days_absent">Number of days absent:</label>
        <input type="number" id="days_absent" placeholder="Enter days absent" />
        <button onclick="calculate()">Calculate</button>
      </div>
      <div id="resultModal" class="modal">
        <div class="modal-content">
            <span><h3>RESULT</h3></span>
          <span class="close" onclick="closeModal()">&times;</span>
          <div id="result" class="result-box">
            <div class="result-header">RESULT</div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
